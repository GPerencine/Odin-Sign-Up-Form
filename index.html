<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="icon" type="image/png" href="./images/GP-logo.png">

    <meta property="og:title" content="Gabriel Perencine | Sign-up Form">
    <meta property="og:description" content="A modern sign-up form built with HTML and CSS as part of The Odin Project Intermediate HTML and CSS course.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gperencine.github.io/Odin-Sign-Up-Form/">
    <meta property="og:image" content="https://gperencine.github.io/Odin-Sign-Up-Form/images/preview.png">
    <meta property="og:site_name" content="Gabriel Perencine">

    <meta name="description" content="Modern sign-up form developed with HTML and CSS, featuring semantic forms, validation states, custom typography, and responsive layout techniques from The Odin Project Intermediate HTML and CSS course.">
    <meta name="author" content="Gabriel Perencine">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div class="header">
            <svg width="210" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg"><g stroke="#FFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M 50,60 L 90,30 M 50,60 L 90,90"/><path d="M 180,42 C 165,30 135,30 120,48 C 105,66 105,84 120,96 C 135,108 165,108 180,90 L 180,70 L 150,70"/><path d="M 205,32 L 205,100 M 205,32 L 235,32 C 255,32 255,68 235,68 L 205,68"/><path d="M 290,25 L 270,100"/><path d="M 310,30 L 350,60 L 310,90"/></g></svg>

            <h1>Gabriel Perencine</h1>
        </div>
        <footer class="credit">
            <p>Photo by <a href="https://unsplash.com/pt-br/fotografias/imac-prata-na-mesa-branca-0fO7J6PGW84" target="_blank">Blvck Paris</a> on Unsplash</p>
        </footer>
    </aside>
    <main>
        <section class="cta">
            <h2>This is not a real online service!</h2>
            <p>This is a modern sign-up form built by me, as part of the Intermediate HTML and CSS course from The Odin Project.</p>
        </section>
        <form action="#" method="POST" class="signup-form">
            <section class="forms">
                <h3>Sign Up!</h3>
                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName"/>
                </div>

                <div class="input-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName"/>
                </div>                        

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com"/>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999"/>
                </div>
                        
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"/>
                </div>
                        
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"/>
                </div>
            </section>
            <section class="end">
                <button type="submit">Create Account</button>
                <p>Already have an Account? <span>Log in</span></p>
            </section>
        </form>
        <footer>
            <p>Copyright &copy; <a href="https://github.com/GPerencine/Odin-Sign-Up-Form" target="_blank">Gabriel Perencine <img src="images/github.svg" alt="GitHub Logo" title="GitHub"></a></p>
        </footer>
    </main>
</body>
</html>
